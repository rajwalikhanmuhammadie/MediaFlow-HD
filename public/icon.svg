<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Premium Dark Navy Background Gradient -->
    <linearGradient id="mf-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#140f2d" />
    </linearGradient>

    <!-- Subtle Ambient Radial Glow -->
    <radialGradient id="mf-glow" cx="256" cy="240" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#060b19" stop-opacity="0" />
    </radialGradient>

    <!-- Border Rim Gradient (Electric Blue to Purple) -->
    <linearGradient id="mf-rim" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Primary Play Symbol Gradient (Electric Blue to Vibrant Purple) -->
    <linearGradient id="mf-play-grad" x1="120" y1="100" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Downward Download Arrow Accent Gradient -->
    <linearGradient id="mf-arrow-grad" x1="256" y1="150" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Soft Drop Shadow for Central Emblem -->
    <filter id="mf-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1d4ed8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Icon Base -->
  <rect width="512" height="512" rx="116" fill="url(#mf-bg)" />
  <rect width="512" height="512" rx="116" fill="url(#mf-glow)" />
  <rect x="8" y="8" width="496" height="496" rx="108" stroke="url(#mf-rim)" stroke-width="6" />

  <!-- Unified Emblem: Modern Video Play Triangle + Downward Download Arrow -->
  <g filter="url(#mf-shadow)">
    <!-- Video Play Symbol Frame (Rounded Triangle in Electric Blue -> Purple Gradient) -->
    <path
      d="M154 128.5C154 106.8 177.5 93.3 196.3 104.2L378.8 209.7C397.5 220.5 397.5 247.5 378.8 258.3L196.3 363.8C177.5 374.7 154 361.2 154 339.5V128.5Z"
      fill="url(#mf-play-grad)"
    />

    <!-- Inner Cutout / Depth Layer for High-Contrast Download Arrow -->
    <path
      d="M256 164V298M256 298L202 244M256 298L310 244"
      stroke="#070c1b"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.45"
    />

    <!-- Downward Download Arrow (Crisp Luminous White-to-Ice-Blue) -->
    <path
      d="M256 160V294M256 294L202 240M256 294L310 240"
      stroke="url(#mf-arrow-grad)"
      stroke-width="34"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Sleek Download Base Tray Underneath -->
    <path
      d="M168 404H344"
      stroke="url(#mf-play-grad)"
      stroke-width="28"
      stroke-linecap="round"
    />
    <path
      d="M204 404H308"
      stroke="#e0f2fe"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.85"
    />
  </g>
</svg>
